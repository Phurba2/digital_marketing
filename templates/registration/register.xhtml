{% extends "base.xhtml" %}
{% block title %}Create Account | Digital Learning{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h1 class="h4 mb-3">Create your account</h1>
        <form method="post">
          {% csrf_token %}
          {{ form.as_div }}
          <button class="btn btn-primary mt-3">Register</button>
        </form>
        <p class="mt-3 mb-0 small">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
