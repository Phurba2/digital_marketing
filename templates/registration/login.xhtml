{% extends "base.xhtml" %}
{% block title %}Log In | Digital Learning{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h1 class="h4 mb-3">Log in</h1>
        <form method="post">
          {% csrf_token %}
          {{ form.as_div }}
          <button class="btn btn-primary mt-3">Log in</button>
        </form>
        <p class="mt-3 mb-0 small">New here? <a href="{% url 'courses:register' %}">Create an account</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
